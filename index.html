275401},{name:"Levoča",desc:"Levoca, ו-Kezmarok, בהן השתמרו בהצלחה טירות עתיקות ומזבחים מהמאות ה-15 וה-17. השתיים נחשבות לתחנות חובה לעצירה עבור חובבי ארכיטקטורה גותית, ומבנים היסטוריים מתקופת הרנסנס.",folder:"מקומות לינה",lat:49.02021,lng:20.584311},{name:"Tatranská Lomnica",desc:"",folder:"מסלולים",lat:49.164499,lng:20.28228},{name:"Jamské tarn",desc:`Štrbské Pleso – Jamské pleso: מסלול קצר וקליל המתאים גם לילדים
מסלול זה נחשב לקליל ביותר, מסומן בבירור ואינו ארוך במיוחד. המסלול מתחיל בסמוך לאגם שטראבסקה, מאחורי מלון Solisko. יש ללכת בעקבות סימון השבילים האדום עד שתגיעו לאגם Jamské. לאורך המסלול תוכלו להינות מנופי היער, ההרים ונהר ה-Biely Vah הזורם לאורך חלק מהמסלול. באגם Jamské תוכלו לעצור לפיקניק מהנה בחיק הטבע.
אורכו של המסלול הוא 5.2 קילומטרים ובהליכה מתונה הוא יקח כשעה וקצת. את הדרך חזרה תוכלו לעשות באותו המסלול או לגוון וללכת בדרך מעט שונה. אם בחרתם ללכת בדרך אחרת חזרה לאגם שטראבסקה עליכם ללכת חזרה לצומת הדרכים הנקראית Odbočka na Biely Váh. משם פנו למסלול הכחול שיוביל אתכם לכיוון Jamrichovo. בנקודה זו עליכם להמשיך במסלול הירוק שיוביל אתכם חזרה לשטראבסקה פלסו.
כדאי לתכנן לפחות שלוש שעות הליכה לאורך המסלול (הלוך ושוב).

② קליל: Hrebienok → מפלי Studený potok + בקתת Bílikova chata — 1–2 שע', קל מאוד.`,tip:"טיפ זהב: לא לוותר על הפוניקולר מ-Starý Smokovec ל-Hrebienok — חוסך ~45 דק' עלייה מפרכת ומשעממת ביער.",rec:"הנוף הכי מתגמל בטטרה הגבוהה ביחס למאמץ. מוצל ובינוני — מצוין לנוער. מהחזקים בטיול, ויש גרסה קצרה אם אין כוח.",tags:["אגמים","נוף"]}),g("trail-skok",{tab:"trails",region:"high",area:"טטרה גבוהה — Štrbské Pleso",name:"מפל Skok + שרשראות",difficulty:"קל-בינוני (עד המפל)",duration:`2.5–3 שע' נטו · 7.5 ק"מ הלוך-חזור`,rating:4,desc:"מהחניון/תחנת הרכבת של Štrbské Pleso, שביל צהוב לכל האורך, דרך עמק קרחוני Mlynická dolina — יער אורנים שנפתח לנופי גרניט. המפל בגובה 1,720מ', נפילת מים ~25מ'. עלייה מתונה, אבל לקראת המפל השביל סלעי (חובה נעלי הליכה, לא לעגלות).",tip:"מעל המפל: טיפוס תלול מאוד עם שרשראות ברזל אל אגם Capie pleso. ההמלצה — לעצור בתחתית המפל ולחזור באותה דרך.",rec:"הרפתקני וכיפי לנוער, ומאוזן — מפל מרשים בלי מאמץ קיצוני. נקודת פיקניק מצוינת.",tags:["מפל","הרפתקני"]}),g("trail-magistrala",{tab:"trails",region:"high",area:"טטרה גבוהה",name:"מגיסטרלה אדומה",difficulty:"קל-בינוני",duration:"~2.5 שע'",rating:4,desc:"Skalnaté Pleso → Hrebienok לאורך השביל הפנורמי המפורסם, עם נוף רציף על הפסגות. עולים ברכבל ויורדים בפוניקולר.",rec:"ערך גבוה למאמץ נמוך — כמעט בלי טיפוס בזכות הרכבלים, ונוף כל הדרך. משתלב עם יום לומניקי/Skalnaté.",tags:["נוף"]}),g("trail-popradske",{tab:"trails",region:"high",area:"טטרה גבוהה",name:"Popradské Pleso",difficulty:"קל",duration:"~3 שע'",rating:4,desc:"מסלול אגם קלאסי ומסומן היטב מ-Štrbské Pleso, מתאים למשפחות, עם מסעדת עץ (קוליבה) על שפת האגם.",rec:"הבחירה ליום עייף או אחרי יום כבד — קל, יפה, ובלי לחץ. אפשר להאריך למעלה אם יש כוח.",tags:["אגם","משפחתי"]}),g("trail-sucha-bela",{tab:"trails",region:"high",area:"סלובנסקי ראג'",name:"Suchá Belá",difficulty:"בינוני",duration:"~שעתיים לראש הקניון + שעתיים חזרה",rating:4,desc:"הנקיק המפורסם של גן העדן הסלובקי — סולמות, שרשראות ו-4 מפלים, חד-כיווני. מתחילים ב-Hrabušice-Podlesok, סימון ירוק. צועדים לצד נחל סוחה בלה, מדלגים מעל עצים שנפלו וסלעים, וחוצים קטעים רטובים (במיוחד אחרי גשם — גובה המים עולה). חזרה באופניים €7.50.",rec:"חוויית סולמות ומים שהנוער יאהב, אבל הכי מתויר באזור. אם הולכים — ב-8:00 בבוקר לפני התור. אחרת Piecky נותן אותו דבר בלי הבלאגן.",warning:'תור של שעה בסופ"ש — להגיע 8:00',tags:["סולמות","מפלים"]}),g("trail-piecky",{tab:"trails",region:"high",area:"סלובנסקי ראג'",name:"Piecky",difficulty:"בינוני-קשה",duration:"3–4 שע'",rating:5,badge:"⭐ הבחירה החכמה",desc:"אותה חוויית סולמות, שרשראות ומפלים כמו Suchá Belá — אבל מעגלי, פחות מוכר וכמעט בלי תורים.",rec:"בול בשבילכם: כל הכיף של גן העדן הסלובקי בלי העומס. אם עושים מסלול סולמות אחד באזור — שיהיה זה.",tags:["סולמות","בלי עומס"]}),g("trail-tomasovsky",{tab:"trails",region:"high",area:"סלובנסקי ראג'",name:"תצפית Tomášovský výhľad",difficulty:"קל",duration:"~1.5–2 שע'",rating:4,desc:"התצפית היפה בגן העדן הסלובקי (680מ') — סלע שטוח ובולט עם נוף מרהיב על הגבעות המיוערות ונהר ההורנד.",rec:"המון נוף במעט מאמץ — מושלם ליום קליל או לשילוב עם מסלול נקיק באזור. גם לילדים קטנים.",tags:["נוף","משפחתי"]}),g("trail-siroke-sedlo",{tab:"trails",region:"high",area:"ז'דיאר → Tatranská Javorina",name:"Široké sedlo (חציית רכס)",difficulty:"בינוני-קשה",duration:`6.5–7.5 שע' · 15 ק"מ`,rating:4,desc:"מהכפר ז'דיאר (ליד Hotel Magura) בסימון אדום דרך עמק Monkova Dolina — יער ואז עלייה תלולה וחשופה עד האוכף ב-1,825מ' עם תצפית 360°. משם ~30 דק' על הרכס ל-Kopské sedlo, וירידה בכחול דרך עמק Zadné Meďodoly לצד נחל עד Tatranská Javorina. עלייה מצטברת ~900מ', בלי סולמות/שרשראות.",warning:"פתוח רק 15.6–31.10! חד-כיווני — מסתיים בכפר אחר, צריך הסעה/שני רכבים. אין אפשרות קיצור באמצע.",tip:"חלופה קלה יותר: לעלות מז'דיאר עד האוכף Široké sedlo, ליהנות מהנוף, ולחזור באותה דרך (הלוך-חזור).",rec:"נוף רכס אמיתי לבן הכושרי, ויוצא מז'דיאר שאתם ממילא שם. אבל ארוך ולוגיסטית מורכב — רק אם פותרים את החזרה.",tags:["רכס","נוף","מאתגר"]}),g("trail-monkova",{tab:"trails",region:"high",area:"ז'דיאר",name:"Monková → Kopské sedlo",difficulty:"בינוני",duration:"~3–4 שע'",rating:3,desc:"עמק בליאנסקה — פראי, שקט ומעט מטיילים, עלייה מתמדת אל אוכף עם נוף.",rec:`יפה ושקט לטעמכם, אבל ארוך ופחות "וואו" מהעמקים המרכזיים. טוב לשלב עם יום ז'דיאר/Bachledka.`,tags:["בלי עומס"]}),g("trail-rohace",{tab:"trails",region:"low",area:"טטרה מערבית — Zuberec",name:"Roháče — חמשת האגמים",difficulty:"קשה",duration:"~6 שע'",rating:4,desc:"אחד המסלולים המרהיבים בסלובקיה: מפל, שרשרת של חמישה אגמים קרחוניים ונוף פסגות עם שאריות שלג. עלייה תלולה, מהחניה ב-Zuberec.",rec:"יום קשה אך מתגמל בטירוף — לנוער כושרני ולמי שרוצה טעם של הרים גבוהים. לא למי שמחפש קליל. מים, נשנושים ומצב רוח.",tags:["אגמים","מאתגר","נוף"]}),g("trail-juranova",{tab:"trails",region:"low",area:"אורבה — ליד Oravice",name:"Juráňova dolina",difficulty:"בינוני",duration:"~3 שע'",rating:4,desc:"מסלול קניונים מקסים עם סולמות קטנים, גשרים ומעברי מים בתוך נקיקים צרים, מעגלי בין שני עמקים.",rec:"כיפי, לא עמוס, ומשתלב מצוין עם המעיינות החמים ב-Oravice + טירת אורבה לאותו יום. אורך ומאמץ סבירים לנוער.",tags:["נקיק","סולמות"]}),g("trail-chopok-dumbier",{tab:"trails",region:"low",area:"טטרה נמוכה — ג'סנה",name:"רכס Chopok → Ďumbier",difficulty:"בינוני",duration:"~4 שע'",rating:5,desc:"עולים ברכבלים מג'סנה ל-Chopok (2,024מ') והולכים על הרכס עם נוף כפול צפון/דרום אל פסגת Ďumbier. מסעדת Rotunda למעלה.",rec:"החזק של הטטרה הנמוכה — נוף פסגות אמיתי בלי הטיפוס הארוך (הרכבל עושה את העבודה). מושלם לשלב הראשון.",tags:["רכס","נוף"]}),g("trail-poludnica",{tab:"trails",region:"low",area:"טטרה נמוכה",name:"Poľudnica",badge:"🏆 מומלץ",difficulty:"בינוני",duration:"3–4 שע'",rating:4,desc:"פסגה שקטה בטטרה הנמוכה עם נוף פנורמי — כמעט בלי תיירים, עלייה מתמדת דרך יער ואחו.",rec:'בדיוק האווירה שאתם אוהבים: שקט מוחלט ונוף גדול. בינוני-מאמץ, מתאים לנוער. יום "הרים בלי המונים".',tags:["בלי עומס","נוף"]}),g("trail-demanovska-hora",{tab:"trails",region:"low",area:"טטרה נמוכה",name:"Demänovská hora",difficulty:"קל-בינוני",duration:"~3 שע'",rating:3,desc:`7 ק"מ, עלייה מתונה של 585מ' מעל עמק הדמנובקה, יוצא ממש מאזור הלינה.`,rec:"נוח ונגיש כי הוא מתחיל ליד הלינה, נוף יפה על העמק. סולידי אבל יש חזקים ממנו באזור — טוב ליום ביניים."}),g("trail-dedinky",{tab:"trails",region:"low",area:"דרום גן העדן הסלובקי",name:"אגם Dedinky — מסלול מעגלי",difficulty:"קל-בינוני",duration:"~3 שע'",rating:3,desc:"מסלול מעגלי יפהפה סביב אגם, דרך יער עם פלגי מים ואחו ירוק עם שולחנות פיקניק, ונוף על האגם בירידה.",rec:"משפחתי ורגוע, מתאים גם לילדים שרגילים ללכת. יפה אבל רחוק יותר — טוב אם ממילא באזור גן העדן הסלובקי.",tags:["אגם","משפחתי"]}),g("trail-prielom",{tab:"trails",region:"high",area:"פנינה",name:"Prielom Lesnického potoka",difficulty:"בינוני",duration:"2–3 שע'",rating:3,desc:"נקיק גיר יפה, כולו בצד הסלובקי של הפנינה.",rec:'נחמד ולא עמוס, אבל הכי הגיוני לשלב עם רפטינג מריה וטירת לובובניה לאותו יום — לבד הוא לא "יעד".',tags:["נקיק"]}),g("trail-janska",{tab:"trails",region:"low",area:"ליפטובסקי יאן — ליד המעיינות/הצימר",name:"עמק Jánska dolina (קצר)",difficulty:"קל",duration:"~1 שע' (ניתן להאריך)",rating:4,desc:"עמק יער יפה שיוצא ממש מליפטובסקי יאן, לצד נחל — נגיש ברגל מהמעיין Kaďa ומהצימר. אפשר סיבוב קצר של שעה או להאריך לתוך העמק (יש גם מערת Stanišovská בדרך).",rec:'בדיוק מה שביקשת — מסלול ~שעה שיוצא מהמעיינות (לא מהאגם). מושלם לאחה"צ קליל, ערב, או השלמה ליום.',tags:["קליל","ליד הלינה","ליד המעיין"]}),g("trail-demanovka",{tab:"trails",region:"low",area:"טטרה נמוכה",name:"נחל חינוכי דמנובקה",difficulty:"קל מאוד",duration:"~1.5 שע'",rating:3,desc:"12 תחנות חינוכיות לאורך הנחל, קליל לגמרי, יוצא מאזור הלינה.",rec:'לא "מסלול נוף" אלא הפוגה נעימה — מצוין ליום גשם קל, ליום מנוחה, או להתאוששות אחרי יום כבד.',tags:["קליל","ליד הלינה"]}),g("trail-vrbicke",{tab:"trails",region:"low",area:"טטרה נמוכה — ג'סנה",name:"Vrbické Pleso",badge:"🕯️ מסלול השבת",difficulty:"קל מאוד",duration:"20–40 דק'",rating:5,desc:"הליכה קצרה וקלילה סביב האגם הטבעי הגדול ביותר בטטרה הנמוכה (1,113מ'), עם ספסלים ופינות פיקניק.",rec:"מושלם למטרתו — הליכת השבת שלכם, וגם ליום רגוע. אגם קסום, אפס מאמץ, 15 דק' לכל כיוון. דירוג 5 בהקשר הזה.",tags:["אגם","שבת"]}),g("trail-diery",{tab:"trails",region:"low",area:"מאלה פטרה (Jánošíkove Diery)",name:"נקיק דיירי (Jánošíkove Diery)",difficulty:"בינוני",duration:"2.5–3 שע' (המעגלי) · 1.5–2 שע' (התחתון)",price:"כניסה חינם! · חניה ~€5–7 ליום (ליד מלון Diery)",rating:5,desc:`שני מסלולים:
